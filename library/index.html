<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="robots" content="noindex">
<title>Greek Live</title>
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Commissioner:wght@400;500;600;700&display=swap">
<style>
/* A dark stage: one featured performance, then poster shelves. Any filter turns shelves into a full tile wall. */
:root {
  color-scheme: dark;
  --bg: #0b0d10; --raise: #161a1f; --line: #2a3038; --ink: #f2f4f6; --muted: #a4aeb8;
  --accent: #e8b84a; --accent-ink: #1a1405; --hd: #7fd4c1;
  --display: "GFS Didot", Georgia, serif;
  --body: "Commissioner", -apple-system, "Segoe UI", Roboto, sans-serif;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar { position: sticky; top: 0; z-index: 20; display: flex; gap: 12px; align-items: center;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px var(--gutter);
  background: rgba(11, 13, 16, .92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { font: 400 1.5rem/1 var(--display); white-space: nowrap; }
.bar input { flex: 1; min-width: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.hero { position: relative; min-height: min(62vh, 620px); display: flex; align-items: flex-end; overflow: hidden; background: var(--raise); }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 2%, rgba(11,13,16,.55) 45%, rgba(11,13,16,.15)); }
.hero-copy { position: relative; z-index: 1; display: grid; gap: 10px; max-width: 760px; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 24px var(--gutter); }
.hero h1 { font: 400 clamp(1.8rem, 4.6vw, 3.4rem)/1.08 var(--display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.line { color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 0; border-radius: 8px; padding: 11px 18px; font-weight: 700; cursor: pointer; text-decoration: none; background: var(--raise); color: var(--ink); display: inline-block; }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.controls { display: grid; gap: 10px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 6px var(--gutter); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.selects { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.selects label { display: grid; gap: 3px; font-size: .78rem; color: var(--muted); min-width: 0; }
.selects select { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 9px; width: 100%; color: var(--ink); }
.count { color: var(--muted); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 0 var(--gutter); font-size: .875rem; }
.shelf { padding-block: 14px 4px; }
.shelf h2 { font: 400 1.5rem/1.2 var(--display); margin: 0 0 10px; padding-left: var(--gutter); }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 22vw); gap: 12px; overflow-x: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 12px var(--gutter); scroll-snap-type: x proximity; scrollbar-width: thin; }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px 12px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 40px var(--gutter); }
.tile { display: grid; gap: 7px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; scroll-snap-align: start; min-width: 0; border-radius: 10px; }
.art { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: var(--raise); }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
.tile:hover .art img, .tile:focus-visible .art img { transform: scale(1.05); }
.badge { position: absolute; bottom: 6px; padding: 2px 7px; border-radius: 5px; background: rgba(0,0,0,.8); font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge.len { right: 6px; }
.badge.q { left: 6px; color: var(--hd); }
.name { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sentinel { height: 1px; }
dialog { width: min(1180px, 100vw); max-width: 100vw; max-height: 100dvh; border: 0; padding: 0; background: var(--bg); color: var(--ink); border-radius: 12px; }
dialog::backdrop { background: rgba(0,0,0,.86); }
.frame { aspect-ratio: 16 / 9; background: #000; }
.frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.info { display: grid; gap: 10px; padding: 14px 16px 18px; }
.info h2 { font: 400 1.5rem/1.2 var(--display); margin: 0; overflow-wrap: anywhere; }
.empty { padding: 40px var(--gutter); color: var(--muted); }
@media (max-width: 720px) {
  .selects { grid-template-columns: 1fr 1fr; }
  .track { grid-auto-columns: 74vw; }
  .wall { grid-template-columns: 1fr; }
  .hero { min-height: 52vh; }
}
@media (prefers-reduced-motion: reduce) { .art img { transition: none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Greek Live</div>
  <input id="q" type="search" placeholder="Search artist, song or place" aria-label="Search" autocomplete="off">
</div>
<section class="hero" id="hero" aria-label="Featured"></section>
<div class="controls">
  <div class="chips" id="types" role="group" aria-label="Category"></div>
  <div class="chips" id="styles" role="group" aria-label="Style"></div>
  <div class="selects">
    <label>Sort<select id="sort">
      <option value="best">Best picks</option><option value="new">Newest uploads</option>
      <option value="long">Longest first</option><option value="short">Shortest first</option><option value="az">Title A to Z</option>
    </select></label>
    <label>Length<select id="len">
      <option value="0">Any length</option><option value="30">30 min or more</option><option value="60">1 hour or more</option><option value="120">2 hours or more</option>
    </select></label>
    <label>Picture<select id="quality">
      <option value="all">Any quality</option><option value="hd">Likely HD or better</option><option value="4k">Marked 4K</option>
    </select></label>
    <label>Artist<select id="artist"><option value="">All artists</option></select></label>
  </div>
</div>
<div class="count" id="count" aria-live="polite"></div>
<main id="main"></main>
<dialog id="player" aria-label="Video player">
  <div class="frame" id="frame"></div>
  <div class="info">
    <h2 id="p-title"></h2>
    <div class="line" id="p-line"></div>
    <div class="cta">
      <a class="btn" id="p-yt" target="_blank" rel="noopener">Open in YouTube</a>
      <a class="btn" id="p-st">Open in Stremio</a>
      <button class="btn" id="p-close" type="button">Close</button>
    </div>
  </div>
</dialog>
<script>
const TYPES = ["All", "Concerts", "Stin Ygeia Mas", "Panigiri and Glenti", "TV Shows", "Tributes"];
const STYLES = ["All styles", "Laïko", "Rebetiko", "Entechno", "Pop", "Epirus", "Regional"];
const rank = { "4K": 0, "HD": 1, "SD": 2 };
const fold = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ς/g, "σ");
const LATIN = { a:"α",b:"β",g:"γ",d:"δ",e:"ε",z:"ζ",i:"ι",k:"κ",l:"λ",m:"μ",n:"ν",x:"ξ",o:"ο",p:"π",r:"ρ",s:"σ",t:"τ",u:"υ",y:"υ",f:"φ",h:"χ",v:"β",c:"κ",w:"ω" };
const toGreek = s => s.replace(/th/g,"θ").replace(/ch/g,"χ").replace(/ps/g,"ψ").replace(/[a-z]/g, c => LATIN[c] || c);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const hex = s => [...new TextEncoder().encode(s)].map(b => b.toString(16).padStart(2, "0")).join("");
const state = { type: "All", style: "All styles" };
let all = [], list = [], shown = 0, observer;

function tile(v) {
  const b = el("button", "tile");
  b.type = "button";
  const art = el("div", "art");
  const img = el("img");
  img.src = v.thumb; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
  img.onerror = () => { if (!img.dataset.f) { img.dataset.f = 1; img.src = "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg"; } };
  art.append(img, el("span", "badge len", v.length));
  if (v.quality !== "SD") art.append(el("span", "badge q", v.quality));
  b.append(art, el("div", "name", v.title), el("div", "sub", [v.type, v.channel].filter(Boolean).join(" · ")));
  b.addEventListener("click", () => play(v));
  return b;
}
function play(v) {
  $("frame").replaceChildren();
  const f = el("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&rel=0";
  f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
  f.allowFullscreen = true; f.title = v.title;
  $("frame").append(f);
  $("p-title").textContent = v.title;
  $("p-line").textContent = [v.length, v.type, v.style, v.channel].filter(Boolean).join(" · ");
  $("p-yt").href = "https://www.youtube.com/watch?v=" + v.id;
  const sid = "ghm" + hex(v.id);
  $("p-st").href = "stremio:///detail/movie/" + sid + "/" + sid;
  $("player").showModal();
}
function closePlayer() { $("frame").replaceChildren(); if ($("player").open) $("player").close(); }
$("p-close").addEventListener("click", closePlayer);
$("player").addEventListener("close", () => $("frame").replaceChildren());
$("player").addEventListener("click", e => { if (e.target === $("player")) closePlayer(); });

function chips(id, names, key) {
  $(id).replaceChildren(...names.map(name => {
    const b = el("button", "", name);
    b.type = "button";
    b.setAttribute("aria-pressed", String(state[key] === name));
    b.addEventListener("click", () => { state[key] = name; chips(id, names, key); render(); });
    return b;
  }));
}
const best = (a, b) => rank[a.quality] - rank[b.quality] || Math.min(b.mins, 150) - Math.min(a.mins, 150);
function filtered() {
  const q = fold($("q").value.trim());
  const len = Number($("len").value), quality = $("quality").value, artist = $("artist").value;
  const out = all.filter(v =>
    (state.type === "All" || v.type === state.type) &&
    (state.style === "All styles" || v.style === state.style) &&
    v.mins >= len && (!artist || v.artist === artist) &&
    (quality === "all" || (quality === "hd" ? v.quality !== "SD" : v.quality === "4K")) &&
    (!q || q.split(/\s+/).every(w => v.text.includes(w) || v.text.includes(toGreek(w)))));
  const sort = $("sort").value;
  const by = { best, long: (a, b) => b.mins - a.mins, short: (a, b) => a.mins - b.mins,
    new: (a, b) => (a.age ?? 1e9) - (b.age ?? 1e9), az: (a, b) => a.title.localeCompare(b.title, "el") };
  return out.sort(by[sort]);
}
function isDefault() {
  return state.type === "All" && state.style === "All styles" && !$("q").value.trim() && $("len").value === "0" &&
    $("quality").value === "all" && !$("artist").value && $("sort").value === "best";
}
function shelf(title, videos) {
  const s = el("section", "shelf");
  s.append(el("h2", "", title));
  const t = el("div", "track");
  t.append(...videos.slice(0, 24).map(tile));
  s.append(t);
  return s;
}
function renderShelves() {
  const by = all.slice().sort(best);
  const main = $("main");
  main.replaceChildren(
    shelf("Full concerts", by.filter(v => v.type === "Concerts" && v.mins >= 60)),
    shelf("Στην υγειά μας", by.filter(v => v.type === "Stin Ygeia Mas" && v.clip === "full")),
    shelf("Epirus", by.filter(v => v.style === "Epirus")),
    shelf("Laïko nights", by.filter(v => v.style === "Laïko" && v.type !== "Stin Ygeia Mas")),
    shelf("Rebetiko", by.filter(v => v.style === "Rebetiko")),
    shelf("Entechno", by.filter(v => v.style === "Entechno")),
    shelf("Panigiri and glenti", by.filter(v => v.type === "Panigiri and Glenti")),
    shelf("Greek pop live", by.filter(v => v.style === "Pop")),
    shelf("Newest uploads", all.filter(v => v.age != null).sort((a, b) => a.age - b.age)));
}
function more() {
  const wall = $("wall");
  if (!wall) return;
  const next = list.slice(shown, shown + 60);
  wall.append(...next.map(tile));
  shown += next.length;
}
function render() {
  list = filtered();
  $("count").textContent = list.length.toLocaleString("en-US") + " videos";
  if (observer) observer.disconnect();
  $("hero").hidden = !isDefault();
  if (isDefault()) { renderShelves(); return; }
  const main = $("main");
  if (!list.length) { main.replaceChildren(el("p", "empty", "Nothing matches. Try removing a filter.")); return; }
  const wall = el("div", "wall"); wall.id = "wall";
  const end = el("div", "sentinel");
  main.replaceChildren(wall, end);
  shown = 0; more();
  observer = new IntersectionObserver(e => { if (e[0].isIntersecting) more(); }, { rootMargin: "900px" });
  observer.observe(end);
}
function hero() {
  const pool = all.filter(v => v.quality !== "SD" && v.type === "Concerts" && v.mins >= 60);
  const v = pool[Math.floor(Math.random() * pool.length)] || all[0];
  const img = el("img"); img.src = v.thumb; img.alt = "";
  const copy = el("div", "hero-copy");
  const go = el("button", "btn main", "Play"); go.type = "button"; go.addEventListener("click", () => play(v));
  const cta = el("div", "cta"); cta.append(go);
  copy.append(el("h1", "", v.title), el("div", "line", [v.length, v.style, v.channel].filter(Boolean).join(" · ")), cta);
  $("hero").replaceChildren(img, copy);
}
async function start() {
  const res = await fetch("data.json");
  all = await res.json();
  all.forEach(v => { v.text = fold(v.title + " " + v.channel + " " + v.artist); });
  const counts = {};
  all.forEach(v => { if (v.artist) counts[v.artist] = (counts[v.artist] || 0) + 1; });
  Object.keys(counts).sort((a, b) => a.localeCompare(b, "el")).forEach(a => { const o = el("option", "", a + " (" + counts[a] + ")"); o.value = a; $("artist").append(o); });
  chips("types", TYPES, "type"); chips("styles", STYLES, "style");
  ["q", "len", "quality", "artist", "sort"].forEach(id => $(id).addEventListener("input", render));
  hero(); render();
}
start().catch(() => { $("main").replaceChildren(el("p", "empty", "The library didn't load. Refresh the page to try again.")); });
</script>
</body>
</html>
